name: Model checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Short model run using packaged weather
        run: python -m solar_saf.run_analysis --hours 168 --no-plots --time-limit 60 --output "${{ runner.temp }}/solar-saf-smoke"
